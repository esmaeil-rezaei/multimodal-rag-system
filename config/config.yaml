# Application Metadata
app:
  name: "Multimodal RAG System"
  version: "1.0.0"
  description: >
    "AI Shopping Recommendation Assistant is a hybrid RAG-based system that uses LLMs
    and semantic search to answer user queries and recommend products. It combines
    intent understanding, vector search, and filtering to return contextual responses
    with product cards."

# Knowledge Base — Source Document Settings
knowledge_base:
  root_dir: "knowledge_base"                    # source root directory
  supported_extensions:                         # supported ingestion formats
    - ".pdf"
    - ".md"
    - ".txt"
    - ".docx"
    - ".html"
    - ".png"
    - ".jpg"
    - ".jpeg"
  scan_recursively: true                        # include subdirectories
  source_metadata_field: "source_name"          # stores folder name as source
  encoding: "utf-8"                             # default encoding

# Data Ingestion & Preprocessing
ingestion:
  parsing:
    pdf_strategy: "hi_res"                      # parsing mode: fast | hi_res | ocr_only
    ocr_languages: ["eng", "fra", "deu"]        # OCR languages
    extract_images: true                        # extract images from PDFs
    extract_tables: true                        # enable table extraction
    image_output_dir: "artifacts/extracted_images"  # temp image storage

  tables:
    extract_tables: true                        # table extraction toggle
    backend: "camelot"                          # table parser backend: camelot | pdfplumber | tatr
    output_format: "markdown"                   # table output format: json | markdown
    handle_merged_cells: true                   # merged cell handling
    multi_page_tables: true                     # join split tables
    store_column_metadata: true                 # keep column info

  image_captioning:
    enabled: true                               # VLM captioning toggle
    model: "gpt-4o"                             # captioning model
    max_tokens: 300                             # max caption length
    store_clip_embeddings: true                 # image embeddings enabled
    clip_model: "openai/clip-vit-large-patch14" # CLIP model

  deduplication:
    enabled: true                               # dedup toggle
    exact_hash_algorithm: "sha256"              # exact match hash
    fuzzy_method: "minhash"                     # fuzzy dedup method: minhash | simhash
    minhash_num_perm: 128                       # MinHash permutations
    jaccard_threshold: 0.85                     # similarity threshold
    keep_strategy: "newest"                     # which duplicate to keep: newest | oldest | highest_quality

  versioning:
    add_timestamp: true                         # add ingestion timestamp
    delta_ingestion: true                       # skip unchanged files
    ttl_days: 365                               # soft expiry window
    version_field: "doc_version"                # version metadata key

# Chunking Strategy
chunking:
  strategy: "semantic"                          # chunking mode: fixed | semantic | hierarchical
  chunk_size: 512                              # max tokens per chunk
  min_chunk_size: 50                           # minimum chunk size
  chunk_overlap: 64                            # overlap (fixed mode only)
  sliding_window: false                        # disabled for semantic mode

  breakpoint_percentile: 0.25                  # split sensitivity
  window_size: 3                               # context window size
  override_chunk_size: 400                     # hierarchical override size

  embedding_backend: "sentence_transformers"   # embedding backend: # translate_then_retrieve | retrieve_then_translate
  embedding_model: "BAAI/bge-large-en-v1.5"    # embedding model

# Embedding Models
embeddings:
  default_model: "BAAI/bge-large-en-v1.5"       # default embedding model
  domain_models:                                # domain-specific overrides
    legal: "BAAI/bge-large-en-v1.5"
    medical: "pritamdeka/S-PubMedBert-MS-MARCO"
    financial: "BAAI/bge-large-en-v1.5"

  multilingual_model: "intfloat/multilingual-e5-large"  # multilingual fallback
  language_detection: true                              # enable language detection
  cross_lingual_strategy: "retrieve_then_translate"     # cross-lingual mode
  embedding_dimensions: 1024                            # vector dimension
  batch_size: 64                                        # embedding batch size

# Vector Index
vector_store:
  backend: "qdrant"                             # vector DB: qdrant | pinecone | weaviate
  collection_name: "multimodal_rag"             # collection name
  distance_metric: "cosine"                     # similarity metric: cosine | dot | euclidean

  hnsw:
    m: 16                                       # graph connectivity
    ef_construct: 200                           # build-time search width
    ef_search: 100                              # query-time search width

  ivf_pq:
    enabled: false                              # compression toggle
    nlist: 1024                                 # clusters
    m_pq: 8                                     # PQ segments

  hybrid_search:
    enabled: true                               # hybrid search toggle
    sparse_backend: "elasticsearch"             # BM25 backend: elasticsearch | opensearch
    sparse_index_name: "rag_sparse"             # index name
    fusion_method: "rrf"                        # ranking fusion method: rrf (reciprocal rank fusion) | linear
    rrf_k: 60                                   # RRF constant
    splade_enabled: false                       # learned sparse model toggle
    splade_model: "naver/splade-cocondenser-ensembledistil"

# Query Understanding
query:
  expansion:
    enabled: true                               # query expansion toggle
    method: "hyde"                              # expansion method: hyde | query2doc | prf
    hyde_model: "gpt-4-turbo"                   # generation model
    hyde_max_tokens: 256                        # max expansion length
    prf_top_k: 3                                # feedback docs

  decomposition:
    enabled: true                               # query decomposition
    max_sub_questions: 4                        # max sub-queries
    intent_classification: true                 # intent detection
    multi_query_k: 3                            # parallel rewrites

  conversation:
    enabled: true                               # conversation mode
    history_window: 6                           # context window size
    condense_model: "gpt-4-turbo"               # query rewrite model

  entity_recognition:
    enabled: true                               # NER toggle
    model: "en_core_web_trf"                    # spaCy model
    temporal_grounding: true                    # time-aware queries
    kg_augmentation: false                      # KG integration disabled

  intent_routing:
    enabled: true
    model: "gpt-4o"
    min_confidence_to_skip: 0.80

  agents:
    orchestrator_model: "gpt-4o"
    worker_model: "gpt-4o"
    max_turns: 15

  guardrails:
    max_input_tokens: 1000
    min_faithfulness_score: 0.40
    min_answer_tokens: 20
    max_answer_tokens: 8000
    

# Retrieval & Re-ranking
retrieval:
  top_k_initial: 20                             # initial retrieval size
  top_k_final: 5                                # final output size

  parent_child:
    enabled: true                               # return parent context

  sentence_window:
    enabled: true                               # expand sentence context
    window_size: 3                              # context window size

  recursive_retrieval: false                    # multi-hop retrieval

  reranking:
    enabled: true                               # reranking toggle
    model: "cohere"                             # reranker backend: cohere | colbertv2 | bge | llm_pointwise
    cohere_model: "rerank-english-v3.0"         # Cohere model
    colbert_model: "colbert-ir/colbertv2.0"     # ColBERT model
    bge_model: "BAAI/bge-reranker-large"        # BGE reranker
    llm_rerank_model: "gpt-4-turbo"             # LLM reranker

  context_ordering:
    strategy: "position_aware"                  # ordering strategy: position_aware | score_desc | interleaved
    compress_before_llm: true                   # pre-LLM compression

  context_management:
    max_context_tokens: 8192                    # token limit
    compression_model: "llm_lingua"             # compression method: llm_lingua | extractive | refine
    llm_lingua_ratio: 0.5                       # compression ratio
    overflow_strategy: "map_reduce"             # overflow handling: map_reduce | refine | truncate

# Generation & Faithfulness
generation:
  model: "gpt-4-turbo"                          # generation model
  temperature: 0.0                              # deterministic output
  max_tokens: 1024                              # response length limit
  grounded_prompting: true                      # enforce grounding

  faithfulness_check:
    enabled: true                               # validation step
    method: "ragas"                             # evaluation method: ragas | selfcheckgpt | nli_classifier
    selfcheck_samples: 5                        # sampling count

  citations:
    enabled: true                               # citation output
    format: "inline"                            # citation style: inline | footnote | endnote
    map_span_to_chunk: true                     # trace to source chunks

  conflict_handling:
    detect_conflicts: true                      # contradiction detection
    freshness_weight: 0.3                       # time weighting
    present_both_on_conflict: true              # show both answers

# Evaluation
evaluation:
  synthetic_qa:
    enabled: true                               # synthetic dataset generation
    num_pairs: 500                              # number of QA pairs
    generator_model: "gpt-4-turbo"              # generator model

  llm_judge:
    enabled: true                               # LLM evaluation
    method: "ragas"                             # ragas" | "custom" | "both"
    model: "gpt-4-turbo"                        # judge model
    criteria: ["faithfulness", "relevance", "coherence", "completeness"]

  pipeline_eval:
    retrieval_metrics: ["recall@k", "ndcg", "mrr"]  # retrieval metrics
    generation_metrics: ["faithfulness", "answer_relevancy", "context_precision"]
    tracing_backend: "arize_phoenix"                # tracing system: arize_phoenix | langsmith | helicone

  drift_detection:
    enabled: true                               # drift monitoring
    reference_window: 1000                      # baseline window
    drift_threshold: 0.15                       # alert threshold
    alert_channel: "slack"                      # alert destination: slack | email | pagerduty

# Production & Operations
operations:
  performance:
    async_retrieval: true                       # async pipeline execution

    semantic_cache:
      enabled: true                             # semantic caching
      backend: "redis"                          # cache backend: redis | in_memory
      similarity_threshold: 0.95                # cache match threshold
      ttl_seconds: 3600                         # cache expiration

    two_stage_retrieval: true                   # fast + slow retrieval

  access_control:
    enabled: true                               # multi-tenant isolation
    backend: "qdrant_namespaces"                # ACL system: qdrant_namespaces | weaviate_rbac
    metadata_acl_field: "allowed_roles"         # role field
    jwt_auth: true                              # authentication enabled

  pii:
    detect_at_ingestion: false                  # PII detection on ingest
    pii_block_on_input: false
    detection_engine: "presidio"                # PII engine: presidio | aws_comprehend
    entities_to_redact:
      - "PERSON"
      - "EMAIL_ADDRESS"
      - "PHONE_NUMBER"
      - "CREDIT_CARD"
      - "US_SSN"
      - "IP_ADDRESS"
    sensitivity_tagging: true                   # sensitivity labeling
    output_scanning: true                       # output filtering

  observability:
    tracing_enabled: true                       # tracing system
    trace_backends: ["langsmith", "arize_phoenix", "helicone"]
    log_token_usage: true                       # token logging
    structured_logging: true                    # JSON logs
    log_chunk_ids: true                         # include source IDs

# Logging
logging:
  format: "json"                                # log format
  rotation: "daily"                             # rotation policy: daily | hourly | size
  retention_days: 30                            # retention period
  log_dir: "logs"                               # log directory
