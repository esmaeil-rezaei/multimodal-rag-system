# Application Metadata
app:
  name: "Multimodal RAG System"
  version: "1.0.0"
  description: >
    "Multimodal AI Assistant is a hybrid RAG-based system that uses LLMs
    and semantic search to answer user queries and recommend products. It combines
    intent understanding, vector search, and filtering to return contextual responses
    with product cards."

# Knowledge Base — Source Document Settings
knowledge_base:
  root_dir: "knowledge_base"                    # source root directory
  supported_extensions:                         # supported ingestion formats
    - ".pdf"
    - ".md"
    - ".txt"
    - ".docx"
    - ".html"
    - ".png"
    - ".jpg"
    - ".jpeg"
  scan_recursively: true                        # include subdirectories
  source_metadata_field: "source_name"          # stores folder name as source
  encoding: "utf-8"                             # default encoding

# Data Ingestion & Preprocessing
ingestion:
  parsing:
    pdf_strategy: "hi_res"                      # parsing mode: fast | hi_res | ocr_only
    ocr_languages: ["eng", "fra", "deu"]        # OCR languages
    extract_images: true                        # extract images from PDFs
    image_output_dir: "artifacts/extracted_images"  # temp image storage

  tables:
    extract_tables: true                        # table extraction toggle
    backend: "camelot"                          # table parser backend: camelot | pdfplumber | tatr
    output_format: "markdown"                   # table output format: json | markdown
    handle_merged_cells: true                   # merged cell handling
    multi_page_tables: true                     # join split tables
    store_column_metadata: true                 # keep column info

  image_captioning:
    enabled: true                               # VLM captioning toggle
    model: "gpt-4o"                             # captioning model
    max_tokens: 300                             # max caption length
    store_clip_embeddings: true                 # image embeddings enabled
    clip_model: "openai/clip-vit-large-patch14" # CLIP model

  deduplication:
    enabled: true                               # dedup toggle
    exact_hash_algorithm: "sha256"              # exact match hash
    fuzzy_method: "minhash"                     # fuzzy dedup method: minhash | simhash
    minhash_num_perm: 128                       # MinHash permutations
    jaccard_threshold: 0.85                     # similarity threshold
    keep_strategy: "newest"                     # which duplicate to keep: newest | oldest | highest_quality

  versioning:
    add_timestamp: true                         # add ingestion timestamp
    delta_ingestion: true                       # skip unchanged files
    ttl_days: 365                               # soft expiry window
    version_field: "doc_version"                # version metadata key

# Chunking Strategy
chunking:
  strategy: "hierarchical"                     # chunking mode: fixed | semantic | hierarchical
  chunk_size: 512                              # max tokens per chunk
  min_chunk_size: 50                           # minimum chunk size
  chunk_overlap: 64                            # overlap (fixed mode only)
  sliding_window: false                        # disabled for semantic mode

  breakpoint_percentile: 0.25                  # split sensitivity
  window_size: 3                               # context window size
  override_chunk_size: 400                     # hierarchical override size

# Embedding Models
embeddings:
  backend: "sentence_transformers"             # embedding backend: openai | sentence_transformers
  default_model: "BAAI/bge-large-en-v1.5"       # default embedding model
  domain_models:                                # domain-specific overrides
    legal: "BAAI/bge-large-en-v1.5"
    medical: "pritamdeka/S-PubMedBert-MS-MARCO"
    financial: "BAAI/bge-large-en-v1.5"

  multilingual_model: "intfloat/multilingual-e5-large"  # multilingual fallback
  language_detection: true                              # enable language detection
  cross_lingual_strategy: "retrieve_then_translate"     # cross-lingual mode
  embedding_dimensions: 1024                            # vector dimension
  batch_size: 64                                        # embedding batch size

# Vector Index
vector_store:
  backend: "qdrant"                             # vector DB: qdrant | pinecone | weaviate
  collection_name: "multimodal_rag"             # collection name
  distance_metric: "cosine"                     # similarity metric: cosine | dot | euclidean

  hnsw:
    m: 16                                       # graph connectivity
    ef_construct: 200                           # build-time search width
    ef_search: 100                              # query-time search width

  ivf_pq:
    enabled: false                              # compression toggle
    nlist: 1024                                 # clusters
    m_pq: 8                                     # PQ segments

  hybrid_search:
    enabled: true                               # hybrid search toggle
    sparse_backend: "elasticsearch"             # BM25 backend: elasticsearch | opensearch
    sparse_index_name: "rag_sparse"             # index name
    fusion_method: "rrf"                        # ranking fusion method: rrf (reciprocal rank fusion) | linear
    rrf_k: 60                                   # RRF constant
    splade_enabled: false                       # learned sparse model toggle
    splade_model: "naver/splade-cocondenser-ensembledistil"

# Query Understanding
query:
  expansion:
    enabled: true                               # query expansion toggle
    method: "hyde"                              # expansion method: hyde | query2doc | prf
    hyde_model: "gpt-4-turbo"                   # generation model
    hyde_max_tokens: 256                        # max expansion length
    prf_top_k: 3                                # feedback docs

  decomposition:
    enabled: true                               # query decomposition
    max_sub_questions: 4                        # max sub-queries
    intent_classification: true                 # intent detection
    multi_query_k: 3                            # parallel rewrites

  conversation:
    enabled: true                               # conversation mode
    history_window: 6                           # context window size
    condense_model: "gpt-4-turbo"               # query rewrite model

  entity_recognition:
    enabled: true                               # NER toggle
    model: "en_core_web_trf"                    # spaCy model
    temporal_grounding: true                    # time-aware queries
    kg_augmentation: false                      # KG integration disabled

  intent_routing:
    enabled: true
    model: "gpt-4o"
    min_confidence_to_skip: 0.80

  agents:
    orchestrator_model: "gpt-4o"
    worker_model: "gpt-4o"
    max_turns: 15

  guardrails:
    max_input_tokens: 1000
    min_faithfulness_score: 0.40
    min_answer_tokens: 20
    max_answer_tokens: 8000
    

# Retrieval & Re-ranking
retrieval:
  top_k_initial: 20                             # initial retrieval size
  top_k_final: 5                                # final output size

  parent_child:
    enabled: true                               # return parent context

  sentence_window:
    enabled: true                               # expand sentence context
    window_size: 3                              # context window size

  recursive_retrieval: false                    # multi-hop retrieval

  reranking:
    enabled: true                               # reranking toggle
    model: "cohere"                             # reranker backend: cohere | colbertv2 | bge | llm_pointwise
    cohere_model: "rerank-english-v3.0"         # Cohere model
    colbert_model: "colbert-ir/colbertv2.0"     # ColBERT model
    bge_model: "BAAI/bge-reranker-large"        # BGE reranker
    llm_rerank_model: "gpt-4-turbo"             # LLM reranker

  context_ordering:
    strategy: "position_aware"                  # ordering strategy: position_aware | score_desc | interleaved
    compress_before_llm: true                   # pre-LLM compression

  context_management:
    max_context_tokens: 8192                    # token limit
    compression_model: "llm_lingua"             # compression method: llm_lingua | extractive | refine
    llm_lingua_ratio: 0.5                       # compression ratio
    overflow_strategy: "map_reduce"             # overflow handling: map_reduce | refine | truncate

# Generation & Faithfulness
generation:
  model: "gpt-4-turbo"                          # generation model
  temperature: 0.0                              # deterministic output
  max_tokens: 1024                              # response length limit
  grounded_prompting: true                      # enforce grounding

  faithfulness_check:
    enabled: false                               # validation step
    method: "ragas"                             # evaluation method: ragas | selfcheckgpt | nli_classifier
    selfcheck_samples: 5                        # sampling count

  citations:
    enabled: true                               # citation output
    format: "inline"                            # citation style: inline | footnote | endnote
    map_span_to_chunk: true                     # trace to source chunks

  conflict_handling:
    detect_conflicts: true                      # contradiction detection
    freshness_weight: 0.3                       # time weighting
    present_both_on_conflict: true              # show both answers

# Evaluation
evaluation:
  synthetic_qa:
    enabled: true                               # synthetic dataset generation
    num_pairs: 500                              # number of QA pairs
    generator_model: "gpt-4-turbo"              # generator model

  llm_judge:
    enabled: true                               # LLM evaluation
    method: "ragas"                             # ragas" | "custom" | "both"
    model: "gpt-4-turbo"                        # judge model
    criteria: ["faithfulness", "relevance", "coherence", "completeness"]

  pipeline_eval:
    retrieval_metrics: ["recall@k", "ndcg", "mrr"]  # retrieval metrics
    generation_metrics: ["faithfulness", "answer_relevancy", "context_precision"]
    tracing_backend: "arize_phoenix"                # tracing system: arize_phoenix | langsmith | helicone

  drift_detection:
    enabled: true                               # drift monitoring
    reference_window: 1000                      # baseline window
    drift_threshold: 0.15                       # alert threshold
    alert_channel: "slack"                      # alert destination: slack | email | pagerduty

# Production & Operations
operations:
  performance:
    async_retrieval: true                       # async pipeline execution

    semantic_cache:
      enabled: true                             # semantic caching
      backend: "redis"                          # cache backend: redis | in_memory
      similarity_threshold: 0.95                # cache match threshold
      ttl_seconds: 3600                         # cache expiration

    two_stage_retrieval: true                   # fast + slow retrieval

  access_control:
    enabled: true                               # multi-tenant isolation
    backend: "qdrant_namespaces"                # ACL system: qdrant_namespaces | weaviate_rbac
    metadata_acl_field: "allowed_roles"         # role field
    jwt_auth: true                              # authentication enabled

  pii:
    detect_at_ingestion: false                  # PII detection on ingest
    pii_block_on_input: false
    detection_engine: "presidio"                # PII engine: presidio | aws_comprehend
    entities_to_redact:
      - "PERSON"
      - "EMAIL_ADDRESS"
      - "PHONE_NUMBER"
      - "CREDIT_CARD"
      - "US_SSN"
      - "IP_ADDRESS"
    sensitivity_tagging: true                   # sensitivity labeling
    output_scanning: true                       # output filtering

  observability:
    tracing_enabled: true                       # tracing system
    trace_backends: ["langsmith", "arize_phoenix", "helicone"]
    log_token_usage: true                       # token logging
    structured_logging: true                    # JSON logs
    log_chunk_ids: true                         # include source IDs

# Logging
log:
  format: "json"                                # log format
  rotation: "daily"                             # rotation policy: daily | hourly | size
  retention_days: 30                            # retention period
  log_dir: "logs"                               # log directory
  unknown_query_dir: "logs/feedback/unknown_queries"     # log unanswerable queries
  liked_response_dir: "logs/feedback/liked_responses"     # log liked responses
  disliked_response_dir: "logs/feedback/disliked_responses" # log disliked responses


graphrag:
  enabled: true                                # Master switch. Set true to activate
  run_community_detection: false               # Run CommunityDetector after ingestion (expensive — disable for incremental runs)

  extraction_model: "gpt-4o"                   # Model for entity/rel extraction
  extraction_temperature: 0.0                  # Deterministic extraction
  extraction_max_tokens: 2048                  # Max tokens per extraction call
  extraction_concurrency: 8                    # Concurrent LLM calls during batch
  max_chunk_chars: 4000                        # Truncate chunk text before LLM call

  community:
    min_community_size: 3                      # Skip communities smaller than this
    resolution_levels: [1.0, 0.5]              # Louvain/Leiden resolutions (fine → coarse)
    summary_model: "gpt-4o"                    # Model for community summary generation
    max_entities_per_summary: 30               # Cap entities fed into summary prompt

  retrieval:
    mode: "hybrid"                             # local | global | hybrid (default)
    local_hop_depth: 2                         # K-hop neighbourhood depth
    community_top_k: 5                         # Community summaries to retrieve
    max_entity_source_chunks: 10               # Max source chunks per entity
    rrf_k: 60                                  # RRF smoothing constant
  
  entity_types:
 
    - DISEASE                         # Alzheimer's disease, vascular dementia, LBD, FTD
    - DISEASE_STAGE                   # preclinical AD, prodromal, MCI, early/moderate/severe AD
    - SYMPTOM                         # memory loss, apathy, agitation, hallucination, word-finding difficulty
    - COMORBIDITY                     # hypertension, diabetes, obesity, cardiovascular disease
    - SYNDROME                        # metabolic syndrome, frailty syndrome, amnestic MCI, dysexecutive syndrome
 
    - COGNITIVE_TEST                  # MMSE, MoCA, CDR, CDR-SB, ADAS-Cog, FAQ, Trail Making Test A/B
    - COGNITIVE_DOMAIN                # episodic memory, working memory, executive function, processing speed
    - COGNITIVE_SCORE                 # specific numeric score: MMSE=24, CDR-SB=4.5, z-score, percentile
    - DIGITAL_ASSESSMENT              # DigiCog, BRANCH, app-based brain game, smartphone cognitive task
    - REMOTE_MONITORING_PLATFORM      # DigiCog app, BRANCH platform, telehealth cognitive screening tool
    - TEST_SESSION                    # day 1 / day 5 session in multi-day paradigms, baseline session
    - PRACTICE_EFFECT                 # within-session or cross-day performance gain unrelated to true change
    - LEARNING_CURVE                  # trajectory of scores across repeated sessions, slope of improvement
 
    - AMYLOID_BIOMARKER               # Aβ42, Aβ40, Aβ42/40 ratio, amyloid PET SUVR, plaque density
    - TAU_BIOMARKER                   # pTau181, pTau217, pTau231, total tau, tau PET SUVR, NFTs
    - NEURODEGENERATION_BIOMARKER     # NfL, GFAP, neurogranin, SNAP-25, synaptic damage markers
    - IMAGING_BIOMARKER               # hippocampal volume, cortical thinning, FDG-PET, fMRI, DTI, FA
    - BLOOD_BIOMARKER                 # plasma pTau217, plasma Aβ42/40, plasma NfL, plasma GFAP, CRP
    - DIGITAL_BIOMARKER               # speech pause, lexical diversity, typing speed, gait from accelerometer
    - COMPOSITE_BIOMARKER             # amyloid+tau score, ATN index, multimodal biomarker score, brain age gap
 
    - BRAIN_REGION                    # hippocampus, entorhinal cortex, prefrontal cortex, temporal lobe, amygdala
 
    - GENETIC_FACTOR                  # APOE ε4, TREM2, BIN1, CLU, PSEN1, PSEN2, APP mutation, SORL1
    - RISK_SCORE                      # polygenic risk score, Framingham risk score, CAIDE score, frailty index
    - VASCULAR_FACTOR                 # white matter hyperintensity, cerebral blood flow, BBB dysfunction, lacunes
    - METABOLIC_FACTOR                # insulin resistance, HbA1c, BMI, dyslipidemia, metabolic syndrome
    - LIFESTYLE_FACTOR                # sleep quality, physical activity, diet, smoking, alcohol, social engagement
    - PSYCHIATRIC_VARIABLE            # depression, anxiety, apathy, NPI score, neuropsychiatric symptoms
    - FUNCTIONAL_VARIABLE             # ADL, IADL, gait speed, falls frequency, functional impairment score
    - NEUROINFLAMMATION_MARKER        # IL-6, TNF-α, IL-1β, CRP, YKL-40, microglial activation, TSPO PET
    - DEMOGRAPHIC_VARIABLE            # age, sex, ethnicity, education years, socioeconomic status
    - COGNITIVE_RESERVE               # education, occupational complexity, bilingualism, brain reserve index
 
    - PROGRESSION_VARIABLE            # annual decline rate, CDR-SB change, trajectory group, time-to-conversion
    - OUTCOME_VARIABLE                # conversion to AD, survival, rapid decliner status, stable cognition
    - TEMPORAL_VARIABLE               # baseline, 6-month follow-up, 12-month, 24-month, pre-symptomatic phase
 
    - DRUG                            # Donepezil, Memantine, Lecanemab, Aducanumab, Donanemab, Gantenerumab
    - INTERVENTION                    # cognitive training, aerobic exercise, multimodal lifestyle intervention
    - TREATMENT_OUTCOME               # amyloid reduction on PET, cognitive stabilization, ARIA-E, ARIA-H
 
    - MECHANISM                       # oxidative stress, synaptic dysfunction, tau propagation, neuronal loss
    - PATHWAY                         # amyloid cascade, glymphatic clearance, neuroinflammatory cascade
    - NETWORK                         # default mode network, salience network, functional connectivity pattern
 
    - COHORT                          # ADNI, NACC, Framingham, UK Biobank, BRANCH, DigiCog study, AIBL, A4
    - STUDY_DESIGN                    # RCT, longitudinal observational, cross-sectional, case-control, pilot
    - POPULATION                      # cognitively normal older adults, MCI patients, APOE ε4 carriers
    - INCLUSION_CRITERION             # age range, NIA-AA diagnosis criteria, MMSE threshold, amyloid positivity
    - EXCLUSION_CRITERION             # major psychiatric disorder, MRI contraindication, non-English speaker
    - STUDY_FINDING                   # concrete result extracted from a paper: "pTau217 AUC=0.89 in ADNI"
 
    - RESEARCH_GAP                    # unexplored relationship, missing longitudinal data, under-studied population
    - LIMITATION                      # small sample, selection bias, cross-sectional design, short follow-up
    - FUTURE_WORK                     # proposed replication, suggested methodology, recommended biomarker study
    - HYPOTHESIS                      # proposed causal mechanism, predicted relationship, testable claim
    - REPLICATION_STATUS              # replicated, contradicted, needs replication, validated in independent cohort
 
    - STATISTICAL_METHOD              # LMM, GEE, Cox regression, SEM, mediation analysis, latent growth curve
    - STATISTICAL_TEST                # t-test, ANOVA, Mann-Whitney, chi-square, Kruskal-Wallis, Fisher exact
    - EFFECT_SIZE_METRIC              # Cohen's d, partial eta-squared, omega-squared, Hedges' g, Glass's delta
    - REGRESSION_COEFFICIENT          # beta, standardized beta, odds ratio, hazard ratio, IRR, interaction term
    - CORRELATION_METRIC              # Pearson r, Spearman rho, Kendall tau, ICC, Cronbach alpha, McDonald omega
    - SIGNIFICANCE_RESULT             # p-value, FDR q-value, Bonferroni threshold, 95% CI, t-statistic, F-stat
    - MODEL_FIT_METRIC                # R-squared, adjusted R-squared, AIC, BIC, RMSE, MAE, log-likelihood
    - PERFORMANCE_METRIC              # AUC-ROC, AUC-PR, sensitivity, specificity, F1, MCC, Youden index
    - FEATURE                         # predictor variable, input feature, LASSO-selected variable, top predictor
 
    - ML_MODEL                        # random forest, XGBoost, SVM, LSTM, transformer, BERT, BioBERT, ensemble
    - EXPLAINABILITY_METHOD           # SHAP, LIME, permutation importance, attention map, integrated gradients
    - DATASET                         # training set, test set, validation set, holdout set, cross-validation fold
    - BENCHMARK                       # baseline model, state-of-the-art comparison, leaderboard, benchmark task
 
    - AI_MODEL                        # GPT-4, Claude, Llama, PubMedBERT, domain-adapted LLM, foundation model
    - RAG_COMPONENT                   # retriever, generator, reranker, knowledge graph, vector store, chunker
    - AGENTIC_AI_CONCEPT              # agent, tool use, orchestrator, multi-agent, ReAct, reasoning chain
 
    - DEVICE                          # smartphone, tablet, smartwatch, Apple Watch, Fitbit, voice assistant
    - SENSOR                          # accelerometer, gyroscope, microphone, PPG sensor, EEG headset, ECG patch
    - SENSOR_SIGNAL                   # step count, HRV, sleep stage, gait speed, voice recording, keystroke timing
 
  relationship_types:
 
    - ASSOCIATED_WITH                 # general statistical association; directionality not established
    - PREDICTS                        # prospective prediction; implies temporal precedence
    - CORRELATES_WITH                 # concurrent correlation; no causal claim
    - INCREASES_RISK_OF               # risk factor raises probability of disease or outcome
    - REDUCES_RISK_OF                 # protective factor lowers probability of disease or outcome
    - PRECEDES                        # temporal ordering: A comes before B
    - CONVERTS_TO                     # clinical progression: MCI converts to AD dementia
    - DECLINES_WITH                   # score, volume, or function declines with disease stage or time
    - IMPROVES_WITH                   # score or function improves with intervention, time, or practice
 
    - CAUSES                          # direct causal claim supported by experimental evidence
    - MEDIATES                        # B mediates the effect of A on C (A → B → C)
    - MODERATES                       # B moderates the effect of A on C; statistical interaction
    - CONFOUNDED_BY                   # observed relationship is confounded by a third variable
    - INTERACTS_WITH                  # biological or statistical interaction (e.g. APOE x sleep)
    - ACCELERATES                     # factor speeds up progression or decline
    - STABILIZES                      # factor slows or arrests progression
    - INHIBITS                        # factor suppresses or down-regulates a mechanism
    - COMPENSATES_FOR                 # cognitive reserve or compensatory mechanism offsets pathology
 
    - SIGNIFICANT_AT                  # finding is statistically significant at a reported threshold
    - NOT_SIGNIFICANT                 # finding did not reach statistical significance; null result
    - REPORTED_FOR                    # statistical result reported for a specific variable or comparison
    - ADJUSTED_FOR                    # result adjusted for covariates at the analysis level
    - COMPARED_BETWEEN                # statistic compared between two specific groups or conditions
    - EFFECT_SIZE_OF                  # effect size metric quantifies magnitude of a specific finding
    - CONFIDENCE_INTERVAL_OF          # CI bounds reported for a specific estimate
    - CORRECTED_BY                    # p-value corrected by FDR, Bonferroni, or permutation method
 
    - IMPROVES_PREDICTION_OF          # adding feature X significantly improves model predicting Y
    - SELECTED_AS_FEATURE_FOR         # variable selected by LASSO, importance ranking for a model/task
    - EXPLAINS_VARIANCE_IN            # R-squared or partial R-squared: A explains variance in B
    - OUTPERFORMS                     # model or method A outperforms B on a specific metric or task
    - TRAINED_ON                      # model trained on a specific dataset or cohort
    - VALIDATED_IN                    # finding or model validated in an independent cohort or dataset
    - GENERALIZES_TO                  # model or finding generalizes to a new population or setting
    - OVERFITS_ON                     # model shows overfitting on a specific dataset
 
    - TRACKS                          # digital or blood biomarker tracks an imaging or CSF biomarker
    - DIFFERENTIATES                  # biomarker or test differentiates group A from group B
    - REPLACES                        # less invasive marker can replace a gold-standard measure
    - CORRESPONDS_TO                  # digital measure corresponds to a validated clinical measure
    - REFLECTS                        # biomarker reflects underlying neuropathology or mechanism
    - PRECEDES_SYMPTOM_ONSET          # biomarker abnormality precedes clinical symptom onset
 
    - SUPPORTS_HYPOTHESIS             # evidence supports a proposed hypothesis
    - CONTRADICTS                     # finding contradicts a prior result or hypothesis
    - REPLICATES                      # finding replicates a prior finding in an independent sample
    - EXTENDS                         # study extends prior work to new population, modality, or condition
    - ADDRESSES_GAP                   # study directly addresses an identified research gap
    - IDENTIFIES_GAP                  # paper identifies this as an open research gap
    - PROPOSES_FUTURE_WORK            # paper recommends this for future investigation
    - HIGHLIGHTS_LIMITATION           # paper flags this as a limitation of the current study
    - GENERATES_HYPOTHESIS            # analysis or finding generates a new testable hypothesis
 
    - CONDUCTED_IN                    # study conducted in a specific cohort or population
    - USES_MEASURE                    # study uses a specific assessment, biomarker, or instrument
    - COMPARES                        # study compares group A versus group B
    - CONTROLS_FOR                    # study design controls for a covariate (design level)
    - STRATIFIED_BY                   # analysis stratified by a variable (e.g. APOE status, sex)
    - ADMINISTERED_TO                 # assessment or intervention administered to a population
    - SUBSET_OF                       # entity A is a subset of entity B
 
    - ADMINISTERED_VIA                # test or task administered via a specific device or platform
    - MEASURES_REMOTELY               # digital tool measures a cognitive domain or variable remotely
    - PASSIVELY_MONITORS              # wearable or app passively monitors a variable without active input
    - COLLECTED_VIA                   # data collected via a specific sensor, device, or platform
    - CORRELATED_WITH_CLINICAL        # digital score correlated with a validated clinical measure
    - EQUIVALENT_TO_CLINICAL          # digital measure shown equivalent to a clinical gold standard
 
    - EXPLAINED_BY                    # model output explained by an explainability method
    - TOP_FEATURE_IN                  # variable is a top-ranked feature in a model
    - INTERACTS_WITH_IN_MODEL         # two features show a significant interaction effect within a model
    - SHAP_VALUE_OF                   # SHAP value quantifies contribution of a feature to model output